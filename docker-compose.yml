services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tourlocal
      MYSQL_USER: tourlocal
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tourlocal}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # Testa por TCP (127.0.0.1), e não pelo socket: na primeira inicialização o MySQL sobe
      # um servidor temporário sem rede, que responderia ao ping pelo socket antes da hora.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    # Se o banco ainda não aceitar conexões, a API tenta de novo em vez de ficar parada.
    restart: on-failure
    environment:
      DATABASE_URL: mysql+pymysql://tourlocal:${MYSQL_PASSWORD:-tourlocal}@db:3306/tourlocal
      SECRET_KEY: ${SECRET_KEY:-chave-de-desenvolvimento-troque-em-producao}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_SENHA: ${SMTP_SENHA:-}
    ports:
      - "8000:8000"
    volumes:
      # Fotos enviadas pelos comerciantes (RF17) sobrevivem a recriações do contêiner.
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads:
